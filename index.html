
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Noxis</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #080808;
    }

    /* ===== FOND AVEC IMAGES QUI DÉFILENT ===== */

    .background {
      position: fixed;
      inset: 0;
      z-index: -3;
      background-size: cover;
      background-position: center;
      animation: slideshow 24s infinite;
    }

    .background::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(
          rgba(0,0,0,0.55),
          rgba(0,0,0,0.75)
        );
      backdrop-filter: blur(8px);
    }

    @keyframes slideshow {
      0%, 20% {
        background-image: url("https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&w=1920&q=80");
      }

      25%, 45% {
        background-image: url("https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=1920&q=80");
      }

      50%, 70% {
        background-image: url("https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1920&q=80");
      }

      75%, 95% {
        background-image: url("https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1920&q=80");
      }

      100% {
        background-image: url("https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&w=1920&q=80");
      }
    }

    /* ===== PETITES PARTICULES ===== */

    .particles {
      position: fixed;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      background-image:
        radial-gradient(circle, rgba(255,255,255,0.25) 1px, transparent 1px);
      background-size: 45px 45px;
      animation: moveParticles 20s linear infinite;
      opacity: 0.25;
    }

    @keyframes moveParticles {
      from {
        transform: translateY(0);
      }

      to {
        transform: translateY(-45px);
      }
    }

    /* ===== CARTE ===== */

    .card {
      width: 430px;
      max-width: 90%;
      padding: 38px 32px 25px;
      text-align: center;

      background: rgba(25, 25, 25, 0.65);
      border: 1px solid rgba(255,255,255,0.12);

      border-radius: 22px;

      box-shadow:
        0 25px 80px rgba(0,0,0,0.65),
        inset 0 0 30px rgba(255,255,255,0.03);

      backdrop-filter: blur(18px);

      animation: appear 1s ease;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.96);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* ===== AVATAR ===== */

    .avatar {
      width: 105px;
      height: 105px;
      margin: auto;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 42px;
      font-weight: bold;

      background: linear-gradient(135deg, #444, #111);

      border: 3px solid rgba(255,255,255,0.85);

      box-shadow:
        0 0 30px rgba(255,255,255,0.15);

      animation: avatarFloat 4s ease-in-out infinite;
    }

    @keyframes avatarFloat {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-5px);
      }
    }

    /* ===== PSEUDO ===== */

    h1 {
      margin-top: 18px;
      font-size: 35px;
      letter-spacing: 1px;
    }

    .bio {
      margin-top: 8px;
      color: rgba(255,255,255,0.7);
      font-size: 14px;
    }

    /* ===== DISCORD ===== */

    .discord {
      display: flex;
      align-items: center;
      justify-content: center;

      width: 54px;
      height: 54px;

      margin: 25px auto 18px;

      border-radius: 15px;

      background: #5865F2;

      color: white;
      text-decoration: none;

      font-size: 25px;

      box-shadow: 0 8px 25px rgba(88,101,242,0.35);

      transition: 0.25s;
    }

    .discord:hover {
      transform: translateY(-4px) scale(1.08);
      box-shadow: 0 12px 35px rgba(88,101,242,0.5);
    }

    /* ===== VUES ===== */

    .views {
      color: rgba(255,255,255,0.55);
      font-size: 13px;
      margin-top: 5px;
    }

    .views span {
      margin-right: 5px;
    }

    /* ===== PETIT TEXTE ===== */

    .footer {
      margin-top: 18px;
      color: rgba(255,255,255,0.25);
      font-size: 11px;
    }

    /* ===== MOBILE ===== */

    @media (max-width: 500px) {
      .card {
        padding: 30px 22px 22px;
      }

      h1 {
        font-size: 30px;
      }

      .avatar {
        width: 90px;
        height: 90px;
      }
    }
  </style>
</head>

<body>

  <div class="background"></div>
  <div class="particles"></div>

  <main class="card">

    <div class="avatar">
      N
    </div>

    <h1>Noxis</h1>

    <p class="bio">
      discret mais jamais invisible 
    </p>

    <a
      class="discord"
      href="https://discord.gg/t432abMpV"
      target="_blank"
      title="Discord"
    >
      💬
    </a>

    <div class="views">
      <span>👁</span>
      <span id="views">1</span>
    </div>

    <div class="footer">
      noxis
    </div>

  </main>

  <script>
    let views = localStorage.getItem("noxisViews");

    if (!views) {
      views = 1;
    } else {
      views = Number(views) + 1;
    }

    localStorage.setItem("noxisViews", views);

    document.getElementById("views").textContent = views;
  </script>

</body>
</html>
