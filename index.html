<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noxis</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #080808;
      overflow: hidden;
    }

    /* FOND */

    .background {
      position: fixed;
      inset: 0;
      z-index: -2;
      background-image: url("https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1920&q=80");
      background-size: cover;
      background-position: center;
      filter: blur(3px);
      transform: scale(1.05);
    }

    .background::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
    }

    /* PARTICULES */

    .particles {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background-image:
        radial-gradient(circle, rgba(255,255,255,0.25) 1px, transparent 1px);
      background-size: 45px 45px;
      opacity: 0.25;
    }

    /* CARTE */

    .card {
      width: 430px;
      max-width: 90%;
      padding: 40px 32px 28px;
      text-align: center;

      background: rgba(18, 18, 18, 0.72);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 22px;

      box-shadow:
        0 25px 80px rgba(0,0,0,0.7),
        inset 0 0 30px rgba(255,255,255,0.03);

      backdrop-filter: blur(18px);

      animation: appear 0.8s ease;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.96);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* PHOTO / AVATAR */

    .avatar {
      width: 105px;
      height: 105px;
      margin: 0 auto 18px;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 42px;
      font-weight: bold;

      background: linear-gradient(135deg, #444, #111);

      border: 3px solid rgba(255,255,255,0.85);

      box-shadow:
        0 0 30px rgba(255,255,255,0.15);

      animation: float 4s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-5px);
      }
    }

    /* NOM */

    h1 {
      font-size: 35px;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    /* DESCRIPTION */

    .bio {
      color: rgba(255,255,255,0.65);
      font-size: 14px;
      margin-bottom: 22px;
    }

    /* DISCORD */

    .discord {
      display: flex;
      align-items: center;
      justify-content: center;

      width: 58px;
      height: 58px;

      margin: 20px auto;

      border-radius: 16px;

      background: #5865F2;
      color: white;

      text-decoration: none;

      font-size: 27px;

      box-shadow: 0 8px 25px rgba(88,101,242,0.35);

      transition: 0.25s;
    }

    .discord:hover {
      transform: translateY(-4px) scale(1.08);
      box-shadow: 0 12px 35px rgba(88,101,242,0.5);
    }

    /* VUES */

    .views {
      color: rgba(255,255,255,0.5);
      font-size: 13px;
      margin-top: 8px;
    }

    /* FOOTER */

    .footer {
      margin-top: 18px;
      color: rgba(255,255,255,0.25);
      font-size: 11px;
    }

    /* MOBILE */

    @media (max-width: 500px) {
      .card {
        padding: 30px 22px 22px;
      }

      h1 {
        font-size: 30px;
      }

      .avatar {
        width: 90px;
        height: 90px;
      }
    }
  </style>
</head>

<body>

  <div class="background"></div>
  <div class="particles"></div>

  <main class="card">

    <div class="avatar">
      N
    </div>

    <h1>Noxis</h1>

    <p class="bio">
      discret mais jamais invisible
    </p>

    <a
      class="discord"
      href="https://discord.gg/t432abMpV"
      target="_blank"
      title="Discord"
    >
      💬
    </a>

    <div class="views">
      👁 <span id="views">1</span> vues
    </div>

    <div class="footer">
      noxis
    </div>

  </main>

  <script>
    let views = localStorage.getItem("noxisViews");

    if (!views) {
      views = 1;
    } else {
      views = Number(views) + 1;
    }

    localStorage.setItem("noxisViews", views);

    document.getElementById("views").textContent = views;
  </script>

</body>
</html>
