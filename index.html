<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Noxis</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  font-family: Arial, Helvetica, sans-serif;
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  background: #080808;
}

/* FOND */
.background {
  position: fixed;
  inset: 0;
  z-index: -2;
  background:
    linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)),
    url("https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1920&q=80");
  background-size: cover;
  background-position: center;
  filter: blur(3px);
  transform: scale(1.05);
}

/* PETITS POINTS */
.particles {
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background-image:
    radial-gradient(circle, rgba(255,255,255,0.25) 1px, transparent 1px);
  background-size: 45px 45px;
  opacity: 0.25;
}

/* CARTE */
.card {
  width: 430px;
  max-width: 90%;
  padding: 40px 32px 28px;
  text-align: center;

  background: rgba(18,18,18,0.75);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 22px;

  box-shadow:
    0 25px 80px rgba(0,0,0,0.7),
    inset 0 0 30px rgba(255,255,255,0.03);

  backdrop-filter: blur(18px);

  animation: appear 0.8s ease;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(20px) scale(0.96);
  }

  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

/* PHOTO DE PROFIL */.avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.avatar {
  width: 105px;
  overflow: hidden;height: 105px;
  
  

  margin: 0 auto 18px;

  border-radius: 50%;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 42px;
  font-weight: bold;

  background: linear-gradient(135deg, #444, #111);

  border: 3px solid rgba(255,255,255,0.85);

  box-shadow:
    0 0 30px rgba(255,255,255,0.15);

  animation: float 4s ease-in-out infinite;
}

@keyframes float {
  0%,100% {
    transform: translateY(0);
  }

  50% {
    transform: translateY(-5px);
  }
}

/* NOM */
h1 {
  font-size: 35px;
  letter-spacing: 1px;
  margin-bottom: 8px;
}

/* BIO */
.bio {
  color: rgba(255,255,255,0.65);
  font-size: 14px;
  margin-bottom: 22px;
}

/* BOUTON DISCORD */
.discord {
  width: 50px;
  height: 50px;

  margin: 20px auto;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 13px;

  background: #5865F2;

  text-decoration: none;

  box-shadow:
    0 8px 25px rgba(88,101,242,0.35);

  transition: 0.25s;
}

.discord:hover {
  transform: translateY(-4px) scale(1.08);

  box-shadow:
    0 12px 35px rgba(88,101,242,0.55);
}

/* VUES */
.views {
  color: rgba(255,255,255,0.5);
  font-size: 13px;
  margin-top: 8px;
}

/* FOOTER */
.footer {
  margin-top: 18px;
  color: rgba(255,255,255,0.25);
  font-size: 11px;
}

/* MOBILE */
@media (max-width: 500px) {

  .card {
    padding: 30px 22px 22px;
  }

  h1 {
    font-size: 30px;
  }

  .avatar {
    width: 90px;
    height: 90px;
  }
}
</style>
</head>

<body>

<div class="background"></div>
<div class="particles"></div>

<main class="card">

  

  <h1>Noxi<div class="avatar">
  <img src="pdp.gunslol" alt="PDP de Noxis">
</div>s</h1>

  <p class="bio">
    discret mais jamais invisible
  </p>

  <!-- DISCORD -->
  <a
    class="discord"
    href="https://discord.gg/t432abMpV"
    target="_blank"
    title="Discord"
  >

    <svg
      viewBox="0 0 127.14 96.36"
      width="27"
      height="27"
      fill="white"
    >

      <path d="M107.7 8.07A105.15 105.15 0 0 0 81.47 0l-3.2 6.49a97.68 97.68 0 0 0-29.39 0L45.68 0a105.89 105.89 0 0 0-26.27 8.09C2.8 32.65-1.7 56.6.55 80.21a105.73 105.73 0 0 0 32.31 16.15l7.82-10.72a67.28 67.28 0 0 1-12.34-5.88l3.02-2.34a75.42 75.42 0 0 0 65.94 0l3.03 2.34a68.68 68.68 0 0 1-12.36 5.89l7.81 10.71a105.54 105.54 0 0 0 32.32-16.15c2.61-27.38-4.47-51.1-20.4-72.14ZM42.45 65.69c-6.42 0-11.73-5.87-11.73-13.08s5.2-13.08 11.73-13.08 11.83 5.87 11.73 13.08c.1 7.21-5.2 13.08-11.73 13.08Zm42.24 0c-6.42 0-11.73-5.87-11.73-13.08s5.2-13.08 11.73-13.08 11.83 5.87 11.73 13.08c.1 7.21-5.2 13.08-11.73 13.08Z"/>

    </svg>

  </a>

  <div class="views">
    👁 <span id="views">1</span> vues
  </div>

  <div class="footer">
    noxis
  </div>

</main>

<script>

let views = localStorage.getItem("noxisViews");

if (!views) {
  views = 1;
} else {
  views = Number(views) + 1;
}

localStorage.setItem("noxisViews", views);

document.getElementById("views").textContent = views;

</script>

</body>
</html>
