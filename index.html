<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noxis</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      color: white;
      background: #080808;
    }

    .profile {
      text-align: center;
      width: 90%;
      max-width: 500px;
      padding: 40px;
      border-radius: 20px;
      background: #141414;
      box-shadow: 0 0 40px rgba(255,255,255,0.08);
    }

    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      margin: 0 auto 20px;
      background: #222;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      font-weight: bold;
    }

    h1 {
      font-size: 36px;
      margin-bottom: 10px;
    }

    .bio {
      color: #aaa;
      margin-bottom: 25px;
    }

    .link {
      display: block;
      padding: 14px;
      margin: 12px 0;
      border-radius: 12px;
      background: #1d1d1d;
      color: white;
      text-decoration: none;
      transition: 0.2s;
    }

    .link:hover {
      background: #292929;
      transform: scale(1.03);
    }
  </style>
</head>

<body>

  <div class="profile">
    <div class="avatar">N</div>

    <h1>Noxis</h1>

    <p class="bio">Mon profil Discord 👑</p>

    <a class="link" href="" target="_blank">https://discord.gg/t432abMpV
      💬 Mon Discord
    </a>
  </div>

</body>
</html>
